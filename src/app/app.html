<header class="hero-header">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="nav-inner">
    <div class="brand-box">
      <div class="logo-badge">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
        >
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      </div>
      <div>
        <div class="title-row">
          <span class="brand-name">{{ brandName }}</span>
          <span class="version-pill">SPA v2.0</span>
        </div>
        <span class="course-label">{{ courseCode }}</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="status-glass">
        <span class="pulse-dot"></span>
        <span>Web API :7182</span>
      </div>

      <div class="user-glass">
        <div class="user-avatar">{{ studentName.charAt(0) | uppercase }}</div>
        <div class="user-info">
          <span class="user-role">Developer</span>
          <span class="user-name">{{ studentName }}</span>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <app-course-list></app-course-list>
</main>
